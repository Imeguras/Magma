name: Feature request
description: A new element, model/parser, property or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The use case or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working (element, property, pipeline example...).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Decoding / video conversion
        - Pre-processing
        - Inference (mgminfer)
        - Parser addon / new model
        - OSD / display / sinks
        - Serialization / Kafka
        - Build / packaging / docs
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
