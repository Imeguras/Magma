name: Format

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==22.1.8

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cpp' '*.h' '*.hpp' '*.hip' \
            | xargs clang-format --dry-run --Werror
